parameters:
  - $ref: '../components/parameters/deviceId.yaml'
get:
  summary: デバイス一覧取得API
  description: システムに登録されている、すべてのデバイスの一覧を取得する
  responses:
    200:
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - deviceName
                - maxTemperature
                - minTemperature
                - maxHumidity
                - minHumidity
                - maxAirPressure
                - minAirPressure
              properties:
                deviceName:
                  $ref: '../components/schemas/deviceName.yaml'
                maxTemperature:
                  $ref: '../components/schemas/maxTemperature.yaml'
                minTemperature:
                  $ref: '../components/schemas/minTemperature.yaml'
                maxHumidity:
                  $ref: '../components/schemas/maxHumidity.yaml'
                minHumidity:
                  $ref: '../components/schemas/minHumidity.yaml'
                maxAirPressure:
                  $ref: '../components/schemas/maxAirPressure.yaml'
                minAirPressure:
                  $ref: '../components/schemas/minAirPressure.yaml'
    404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '../components/schemas/error.yaml'
    500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/error.yaml'